<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FireFly</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    #hasil {
      margin-top: 20px;
    }

    .success {
      padding: 15px;
      border-radius: 12px;
      background: #f1f8f4;
    }

    .loading {
      margin-top: 10px;
      font-size: 14px;
      color: #777;
    }
  </style>

  <script>
    function onTelegramAuth(user) {
      document.getElementById("hasil").innerHTML =
        '<div class="success">' +
        '<strong>Login berhasil</strong>' +
        '<p>Halo ' + (user.first_name || "") + '</p>' +
        '<div class="loading">Membuka Telegram Web K...</div>' +
        '</div>';

      setTimeout(function () {
        window.location.href = "https://web.telegram.org/k/";
      }, 1500);
    }
  </script>
</head>

<body>

  <div class="card">

    <h1>FireFly</h1>

    <p>
      Masuk menggunakan akun Telegram Anda.
    </p>

    <script async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="FireFly12022024Bot"
      data-size="large"
      data-userpic="true"
      data-onauth="onTelegramAuth(user)">
    </script>

    <div id="hasil"></div>

  </div>

</body>
</html>
