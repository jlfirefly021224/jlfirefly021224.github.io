<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireFly Login</title>
</head>

<body>
  <h1>FireFly</h1>
  <p>Login menggunakan akun Telegram:</p>

  <script async
    src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-login="FireFly12022024Bot"
    data-size="large"
    data-userpic="true"
    data-onauth="onTelegramAuth(user)">
  </script>

  <div id="hasil"></div>

  <script>
    function onTelegramAuth(user) {
      document.getElementById("hasil").innerHTML =
        "<h2>Login berhasil</h2>" +
        "<p>ID Telegram: " + user.id + "</p>" +
        "<p>Nama: " + (user.first_name || "") + "</p>" +
        "<p>Username: " + (user.username ? "@" + user.username : "Tidak ada") + "</p>";
    }
  </script>
</body>
</html>
